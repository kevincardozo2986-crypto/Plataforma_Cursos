<div
  class="accessibility"
  [class.dark]="darkMode()"
  (keydown.escape)="open.set(false)"
>
  <!-- BOTÓN PRINCIPAL -->
  <button
    type="button"
    class="trigger"
    (click)="open.set(!open())"
    [attr.aria-expanded]="open()"
    aria-controls="access-options"
  >
    <span class="trigger-icon">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="4" r="2" />
        <path d="M4 8h16M12 8v6m0 0-5 7m5-7 5 7" />
      </svg>
    </span>

    <span class="label">
      {{ language() === 'es' ? 'Accesibilidad' : 'Accessibility' }}
    </span>

    <svg
      class="chevron"
      [class.rotated]="open()"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path d="m7 10 5 5 5-5" />
    </svg>
  </button>

  <!-- PANEL -->
  @if (open()) {
    <div
      id="access-options"
      class="options"
    >
      <!-- HEADER -->
      <header class="menu-header">
        <div class="header-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="4" r="2" />
            <path d="M4 8h16M12 8v6m0 0-5 7m5-7 5 7" />
          </svg>
        </div>

        <div>
          <strong>
            {{
              language() === 'es'
                ? 'Accesibilidad'
                : 'Accessibility'
            }}
          </strong>

          <span>
            {{
              language() === 'es'
                ? 'Personaliza tu experiencia'
                : 'Customize your experience'
            }}
          </span>
        </div>
      </header>

      <div class="divider"></div>

      <!-- MODO OSCURO -->
      <button
        type="button"
        class="option-row"
        (click)="toggleDarkMode()"
        [attr.aria-pressed]="darkMode()"
      >
        <span class="option-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5
                 8.5 8.5 0 1 0 20.5 14.5Z"
            />
          </svg>
        </span>

        <span class="option-copy">
          <strong>
            {{
              language() === 'es'
                ? 'Modo oscuro'
                : 'Dark mode'
            }}
          </strong>

          <small>
            {{
              language() === 'es'
                ? 'Reduce el brillo de la interfaz'
                : 'Reduce interface brightness'
            }}
          </small>
        </span>

        <span
          class="switch"
          [class.active]="darkMode()"
          aria-hidden="true"
        >
          <span></span>
        </span>
      </button>

      <!-- TEXTO GRANDE -->
      <button
        type="button"
        class="option-row"
        (click)="largeText.set(!largeText())"
        [attr.aria-pressed]="largeText()"
      >
        <span class="option-icon text-icon">
          Aa
        </span>

        <span class="option-copy">
          <strong>
            {{
              language() === 'es'
                ? 'Texto grande'
                : 'Large text'
            }}
          </strong>

          <small>
            {{
              language() === 'es'
                ? 'Aumenta el tamaño del contenido'
                : 'Increase content size'
            }}
          </small>
        </span>

        <span
          class="switch"
          [class.active]="largeText()"
          aria-hidden="true"
        >
          <span></span>
        </span>
      </button>

      <!-- ALTO CONTRASTE -->
      <button
        type="button"
        class="option-row"
        (click)="contrast.set(!contrast())"
        [attr.aria-pressed]="contrast()"
      >
        <span class="option-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8" />
            <path d="M12 4v16" />
          </svg>
        </span>

        <span class="option-copy">
          <strong>
            {{
              language() === 'es'
                ? 'Alto contraste'
                : 'High contrast'
            }}
          </strong>

          <small>
            {{
              language() === 'es'
                ? 'Mejora la visibilidad'
                : 'Improve visibility'
            }}
          </small>
        </span>

        <span
          class="switch"
          [class.active]="contrast()"
          aria-hidden="true"
        >
          <span></span>
        </span>
      </button>

      <div class="divider"></div>

      <!-- IDIOMA -->
      <section class="language-section">
        <span class="section-title">
          {{
            language() === 'es'
              ? 'Idioma'
              : 'Language'
          }}
        </span>

        <div class="language-selector">
          <button
            type="button"
            [class.active]="language() === 'es'"
            (click)="changeLanguage('es')"
          >
            <span>ES</span>
            Español
          </button>

          <button
            type="button"
            [class.active]="language() === 'en'"
            (click)="changeLanguage('en')"
          >
            <span>EN</span>
            English
          </button>
        </div>
      </section>
    </div>
  }
</div>
