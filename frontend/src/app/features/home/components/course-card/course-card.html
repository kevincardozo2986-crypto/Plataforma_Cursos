<article class="course-card">
  <div class="course-image">
    <img [src]="course().image | publicUrl" [alt]="course().title" />

    <span class="category">
      {{ course().category }}
    </span>

    @if (course().rating) {
      <span class="rating">
        <span aria-hidden="true">★</span>
        {{ course().rating }}
      </span>
    }
  </div>

  <div class="course-content">
    <div class="course-meta">
      <span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" />
        </svg>

        {{ course().duration | t }}
      </span>

      <span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 19V9" />
          <path d="M10 19V5" />
          <path d="M16 19v-7" />
        </svg>

        {{ course().level | t }}
      </span>
    </div>

    <h3>
      {{ course().title }}
    </h3>

    <p>
      {{ course().description }}
    </p>

    <div class="course-footer">
      <div class="price">
        <small>{{ 'Valor del curso' | t }}</small>

        <strong>
          {{ formatPrice(course().price) }}
        </strong>
      </div>

      <button type="button" class="view-course" (click)="selected.emit(course().id)">
        {{ 'Ver curso' | t }}

        <span aria-hidden="true"> → </span>
      </button>
    </div>
  </div>
</article>
