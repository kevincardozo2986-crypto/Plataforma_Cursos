<main class="home-page">
  <app-courses-section
    id="courses"
    [courses]="courses()"
    [loading]="coursesLoading()"
    [error]="coursesError()"
  />

  @if (!coursesLoading() && !coursesError() && courses().length > 0) {
    <nav class="catalog-more" [attr.aria-label]="'Más cursos' | t">
      <p>
        {{ 'Mostrando' | t }} {{ courses().length }} {{ 'de' | t }} {{ total() }} {{ 'cursos' | t }}
      </p>
      @if (moreError()) {
        <p class="catalog-more-error" role="alert">{{ moreError() }}</p>
      }
      @if (hasMore()) {
        <button
          type="button"
          class="catalog-more-button"
          [disabled]="loadingMore()"
          (click)="loadMore()"
        >
          {{ loadingMore() ? ('Cargando…' | t) : ('Ver más cursos' | t) }}
        </button>
      }
    </nav>
  }
</main>
